<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Student Budget Planner BD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Floating Navigation Bar -->
    <nav class="floating-nav">
        <div class="nav-content">
            <h1 class="logo"><i class="ph ph-wallet" style="margin-right: 6px;"></i>Budget<span>BD</span></h1>
            <div class="nav-links">
                <a href="index.html"><i class="ph ph-squares-four"></i>Dashboard</a>
                <a href="transactions.html" class="active"><i class="ph ph-receipt"></i>Transactions</a>
                <a href="budget.html"><i class="ph ph-chart-pie-slice"></i>Budget</a>
                <a href="charts.html"><i class="ph ph-chart-bar"></i>Charts</a>
                <a href="monthly.html"><i class="ph ph-calendar"></i>Monthly View</a>
                <a href="semester.html"><i class="ph ph-graduation-cap"></i>Semester</a>
            </div>
            <div class="user-profile">
                <div class="avatar" title="Student Profile">S</div>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <div>
                <h2>Transactions Log</h2>
                <p style="color: var(--text-muted); margin-top: 2px; font-size: 0.85rem;">Full 12-month transaction record with search and multi-criteria filtering.</p>
            </div>
            <div id="filter-summary-badge" style="font-weight: 600; font-size: 0.85rem; color: var(--text-muted);">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Filter Bar -->
        <section class="filter-bar">
            <div class="filter-controls">
                <select id="filter-type">
                    <option value="all">All Types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <select id="filter-category">
                    <option value="all">All Categories</option>
                    <option value="Mess Bill">Mess Bill</option>
                    <option value="Transport">Transport</option>
                    <option value="Recharge">Recharge</option>
                    <option value="Tuition">Tuition</option>
                    <option value="Other Expenses">Other Expenses</option>
                    <option value="Income">Income</option>
                </select>

                <select id="filter-month">
                    <option value="all">All 12 Months</option>
                    <option value="2026-01">January 2026</option>
                    <option value="2026-02">February 2026</option>
                    <option value="2026-03">March 2026</option>
                    <option value="2026-04">April 2026</option>
                    <option value="2026-05">May 2026</option>
                    <option value="2026-06">June 2026</option>
                    <option value="2026-07">July 2026</option>
                    <option value="2026-08">August 2026</option>
                    <option value="2026-09">September 2026</option>
                    <option value="2026-10">October 2026</option>
                    <option value="2026-11">November 2026</option>
                    <option value="2026-12">December 2026</option>
                </select>

                <input type="text" id="search-input" class="search-input" placeholder="Search description...">
            </div>
        </section>

        <!-- Data Table -->
        <section class="table-responsive">
            <table class="data-table" id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th style="text-align: center;">Del</th>
                    </tr>
                </thead>
                <tbody id="transactions-tbody">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </section>
    </main>

    <footer style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.825rem; margin-top: 36px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <p>&copy; 2026 Student Budget Planner BD. Web Programming Group Project - Uttara University.</p>
        <button class="btn-danger-outline" onclick="clearAllData()"><i class="ph ph-trash"></i>Clear All Data</button>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
